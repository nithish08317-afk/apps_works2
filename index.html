<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Apps Works Store</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: same one-screen departures board as Apps Hub. Each category is a coloured label block + a strip of product tiles,
   with type chips (sub-categories) above the strip. Categories, types and products are all added from the page. */
:root {
  --bg: #0e131b;
  --panel: #151c27;
  --tile: #1c2533;
  --tile-hover: #222d3e;
  --ink: #eef2f8;
  --soft: #97a5ba;
  --line: #2a3547;
  --accent: #ffb703;
  --live: #4cd69b;
  --danger: #ff6b6b;
  --on-hue: #0b1018;
  --h1: #9b87f5; --h2: #3cc3e8; --h3: #ff9b54; --h4: #f2c94c; --h5: #4cd69b; --h6: #ff7aa8;
  --f-display: "Syne", "Trebuchet MS", system-ui, sans-serif;
  --f-body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #e9edf3; --panel: #f7f9fc; --tile: #ffffff; --tile-hover: #f1f5fb; --ink: #0f1a2c; --soft: #5a6a82;
    --line: #cdd6e3; --accent: #c77700; --live: #12875d; --danger: #c93a3a; --on-hue: #ffffff;
    --h1: #6a4cd6; --h2: #0f86ad; --h3: #d4600c; --h4: #a87400; --h5: #12875d; --h6: #c93a72;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #e9edf3; --panel: #f7f9fc; --tile: #ffffff; --tile-hover: #f1f5fb; --ink: #0f1a2c; --soft: #5a6a82;
  --line: #cdd6e3; --accent: #c77700; --live: #12875d; --danger: #c93a3a; --on-hue: #ffffff;
  --h1: #6a4cd6; --h2: #0f86ad; --h3: #d4600c; --h4: #a87400; --h5: #12875d; --h6: #c93a72;
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 15px; line-height: 1.4;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
}
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app-shell { min-height: 100%; max-width: 1840px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }

/* header */
.top { display: flex; align-items: center; gap: 12px 18px; flex-wrap: wrap; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px 14px; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1 1 220px; }
.mark { width: 38px; height: 38px; flex: none; }
.brand h1 { margin: 0; font-family: var(--f-display); font-weight: 800; font-size: 22px; letter-spacing: -.02em; line-height: 1.05; }
.brand p { margin: 2px 0 0; font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--soft); }
.search { position: relative; flex: 0 1 340px; min-width: 180px; }
.search input { width: 100%; padding: 9px 92px 9px 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; }
.search input::placeholder { color: var(--soft); }
.s-meta { position: absolute; right: 9px; top: 50%; transform: translateY(-50%); display: flex; align-items: center; gap: 6px; font-family: var(--f-mono); font-size: 11px; color: var(--soft); }
.s-meta kbd { font-family: var(--f-mono); font-size: 11px; color: var(--soft); border: 1px solid var(--line); border-radius: 4px; padding: 0 6px; }
.s-clear { display: none; place-items: center; width: 22px; height: 22px; padding: 0; border: 0; border-radius: 6px; background: var(--tile-hover); cursor: pointer; }
.s-clear svg { width: 11px; height: 11px; }
.search.has-value .s-clear { display: grid; }
.search.has-value kbd { display: none; }
.status { display: flex; align-items: center; gap: 12px; font-family: var(--f-mono); }
.live { display: flex; align-items: center; gap: 8px; font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--soft); white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--live); animation: pulse 2.4s infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--live) 70%, transparent); } 70%, 100% { box-shadow: 0 0 0 8px transparent; } }
.time { font-size: 21px; font-weight: 500; letter-spacing: .05em; color: var(--accent); font-variant-numeric: tabular-nums; }
.date { font-size: 12px; color: var(--soft); text-align: right; line-height: 1.3; }
.actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.theme-btn { background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 7px 11px; font-family: var(--f-mono); font-size: 12px; cursor: pointer; }
.theme-btn:hover { background: var(--tile-hover); }

.sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.skip { position: absolute; left: 12px; top: -60px; z-index: 200; padding: 8px 14px; background: var(--ink); color: var(--bg); border-radius: 8px; text-decoration: none; font-weight: 600; }
.skip:focus { top: 10px; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 18px; border: 1px solid var(--line); border-radius: 10px; background: transparent; color: var(--ink); font-weight: 600; text-decoration: none; cursor: pointer; }
.btn:hover { background: var(--tile-hover); }
.btn.primary { background: var(--accent); color: var(--bg); border-color: transparent; }
.btn.primary:hover { filter: brightness(1.08); }
.btn:disabled { opacity: .7; cursor: default; }
.btn svg { width: 16px; height: 16px; flex: none; }
.btn.sm { height: 34px; padding: 0 13px; font-size: 13.5px; border-radius: 8px; }
.btn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.badge { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--accent); color: var(--bg); font-family: var(--f-mono); font-size: 11px; font-weight: 500; }

/* category rows */
.board { flex: 1 0 auto; display: flex; flex-direction: column; gap: 6px; }
.row { --hue: var(--h1); min-height: 74px; flex: 1 0 auto; display: grid; grid-template-columns: 180px minmax(0, 1fr); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.label { background: var(--hue); color: var(--on-hue); padding: 8px 12px; display: flex; flex-direction: column; justify-content: center; gap: 3px; min-width: 0; position: relative; }
.lh { display: flex; align-items: center; gap: 9px; min-width: 0; }
.cico { flex: none; width: 26px; height: 26px; padding: 4px; border-radius: 8px; background: color-mix(in srgb, var(--on-hue) 16%, transparent); }
.label h2 { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: 15px; letter-spacing: -.01em; line-height: 1.12; text-wrap: balance; overflow-wrap: anywhere; }
.label .n { font-family: var(--f-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; opacity: .82; }
.nav { display: none; gap: 6px; margin-top: 5px; }
.row[data-overflow="true"] .nav { display: flex; }
@media (min-width: 761px) { .row[data-overflow="true"] .nav { position: absolute; right: 10px; bottom: 8px; margin: 0; } }
.nav button { width: 28px; height: 24px; border: 1px solid color-mix(in srgb, var(--on-hue) 45%, transparent); background: color-mix(in srgb, var(--on-hue) 10%, transparent); color: var(--on-hue); border-radius: 6px; cursor: pointer; line-height: 1; font-size: 15px; padding: 0; }
.nav button:hover:not(:disabled) { background: color-mix(in srgb, var(--on-hue) 24%, transparent); }
.nav button:disabled { opacity: .35; cursor: default; }
.del-cat { display: none; margin-top: 6px; align-self: flex-start; height: 26px; padding: 0 10px; border-radius: 6px; border: 1px solid color-mix(in srgb, var(--on-hue) 55%, transparent); background: color-mix(in srgb, var(--on-hue) 12%, transparent); color: var(--on-hue); font-family: var(--f-mono); font-size: 11px; cursor: pointer; }
body.manage .del-cat { display: inline-block; }

.pane { display: flex; flex-direction: column; min-width: 0; }
.chips { flex: none; display: flex; gap: 6px; padding: 8px 8px 0; overflow-x: auto; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; padding: 3px 12px; border: 1px solid var(--line); border-radius: 999px; background: transparent; font-family: var(--f-mono); font-size: 11.5px; letter-spacing: .04em; cursor: pointer; white-space: nowrap; }
.chip:hover { border-color: var(--hue); }
.chip[aria-pressed="true"] { background: var(--hue); color: var(--on-hue); border-color: transparent; }
.chip.add-type { display: none; border-style: dashed; color: var(--soft); }
body.manage .chip.add-type { display: inline-block; }

.strip { flex: 1; display: flex; align-items: center; gap: 6px; padding: 6px 8px; overflow-x: auto; overflow-y: hidden; scroll-snap-type: none; scroll-padding-inline: 8px; scrollbar-width: none; -ms-overflow-style: none; min-width: 0; }
.strip::-webkit-scrollbar { display: none; width: 0; height: 0; }
.tile { flex: 0 0 176px; min-width: 176px; scroll-snap-align: start; display: flex; align-items: center; gap: 9px; padding: 6px 10px; background: var(--tile); border: 1px solid var(--line); border-radius: 10px; position: relative; }
.tile:hover { background: var(--tile-hover); border-color: var(--hue); }
.aico { width: 18px; height: 18px; }
.mono { flex: none; width: 36px; height: 36px; display: grid; place-items: center; overflow: hidden; border-radius: 10px; background: color-mix(in srgb, var(--hue) 18%, transparent); color: var(--hue); border: 1px solid color-mix(in srgb, var(--hue) 40%, transparent); }
.mono .pimg { width: 100%; height: 100%; object-fit: cover; display: block; }
.txt { min-width: 0; flex: 1; }
.name { font-weight: 600; font-size: 14px; line-height: 1.2; overflow-wrap: anywhere; }
.desc { font-size: 11.5px; color: var(--soft); line-height: 1.3; margin-top: 1px; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.meta { display: flex; align-items: center; gap: 8px; margin-top: 4px; flex-wrap: wrap; }
.price { font-family: var(--f-mono); font-size: 14px; font-weight: 500; color: var(--accent); font-variant-numeric: tabular-nums; }
.tag { flex: none; font-family: var(--f-mono); font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; padding: 1px 5px; border: 1px solid var(--hue); color: var(--hue); border-radius: 3px; }
.add { flex: none; display: grid; place-items: center; width: 34px; height: 34px; padding: 0; border: 1px solid var(--line); border-radius: 9px; background: transparent; cursor: pointer; color: var(--ink); }
.add:hover { background: var(--hue); color: var(--on-hue); border-color: transparent; }
.add svg { width: 16px; height: 16px; }
.del { display: none; position: absolute; top: 5px; right: 5px; place-items: center; min-width: 24px; height: 24px; padding: 0 6px; border: 1px solid var(--danger); border-radius: 6px; background: var(--tile); color: var(--danger); font-family: var(--f-mono); font-size: 11px; cursor: pointer; }
.del svg { width: 11px; height: 11px; }
body.manage .del { display: grid; }
.tile[data-open] { cursor: pointer; }
.tile.idle { cursor: default; }
.tile[data-vtype] { cursor: pointer; }
#favs { margin-bottom: 6px; }
#favs:empty { display: none; }
.favs-row .lh svg { color: var(--accent); fill: currentColor; }
.fav-hint { flex: 1; padding: 8px 12px; color: var(--soft); font-size: 13px; }
.fav-clear { margin-left: auto; background: none; border: 0; color: var(--soft); font-size: 12px; cursor: pointer; text-decoration: underline; padding: 0; }
.fav-clear:hover { color: var(--ink); }
.tile { transition: transform .15s, box-shadow .15s, background .15s, border-color .15s; }
.tile .mono { transition: background .15s, color .15s; }
.tile:not(.add-tile):hover, .tile.lit { background: var(--tile-hover); border-color: var(--hue); box-shadow: 0 0 0 1px var(--hue), 0 8px 20px color-mix(in srgb, var(--hue) 22%, transparent); transform: translateY(-2px); }
.tile:not(.add-tile):hover .mono, .tile.lit .mono { background: var(--hue); color: var(--on-hue); }
.tile:not(.add-tile):hover .name, .tile.lit .name { color: var(--hue); }
.tile .go { flex: none; width: 16px; height: 16px; color: var(--soft); opacity: .6; transition: transform .12s, opacity .12s, color .12s; }
.tile .go svg { width: 16px; height: 16px; }
.tile:hover .go, .tile:focus-visible .go { opacity: 1; color: var(--hue); transform: translateX(2px); }
.tile.add-tile { flex: 0 0 120px; min-width: 120px; justify-content: center; border-style: dashed; background: transparent; color: var(--soft); font: inherit; cursor: pointer; }
.tile.add-tile { display: none; }
body.manage .tile.add-tile { display: flex; }
.tile.add-tile:hover { color: var(--ink); border-color: var(--hue); }
.tile.add-tile .name { color: inherit; }
.board.searching .tile.add-tile { display: none; }
.plist { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
.pitem { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; gap: 12px; align-items: center; padding: 10px 12px; background: var(--tile); border: 1px solid var(--line); border-radius: 10px; }
.pitem .ln { font-weight: 600; overflow-wrap: anywhere; }
.pitem .lt { font-size: 12.5px; color: var(--soft); line-height: 1.3; overflow-wrap: anywhere; }
.pitem .lp { font-family: var(--f-mono); font-weight: 500; color: var(--accent); font-variant-numeric: tabular-nums; margin-top: 2px; }
.pitem .add:hover { background: var(--hue); color: var(--on-hue); border-color: transparent; }
.pdel { display: none; color: var(--danger); }
body.manage .pdel { display: inline-block; }
.empty-in { flex: 1; display: flex; align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap; padding: 10px; border: 1px dashed var(--line); border-radius: 10px; color: var(--soft); font-size: 14px; text-align: center; }

.empty { padding: 36px 16px; text-align: center; color: var(--soft); border: 1px dashed var(--line); border-radius: 12px; }
.empty h3 { margin: 0 0 6px; font-family: var(--f-display); font-size: 20px; color: var(--ink); }
.empty p { margin: 0; }
.empty .q { color: var(--ink); font-weight: 600; }
.empty .btn { margin-top: 12px; }

.foot { flex: none; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 6px 20px; font-size: 12px; color: var(--soft); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 16px; }
.foot strong { color: var(--ink); font-weight: 600; }
.foot .m { font-family: var(--f-mono); }
.foot .link { background: none; border: 0; padding: 0; color: var(--soft); text-decoration: underline; cursor: pointer; font-size: 12px; }
.foot .link:hover { color: var(--ink); }

/* dialogs */
.modal { position: fixed; inset: 0; z-index: 100; display: none; place-items: center; padding: 16px; background: rgba(6, 10, 18, .6); backdrop-filter: blur(4px); opacity: 0; transition: opacity .2s; }
.modal.open { opacity: 1; }
.m-panel { position: relative; width: min(440px, 100%); max-height: calc(100% - 8px); overflow-y: auto; padding: 26px 24px 22px; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 16px; }
.m-panel.wide { width: min(560px, 100%); }
.m-close { position: absolute; top: 10px; right: 10px; display: grid; place-items: center; width: 32px; height: 32px; padding: 0; border: 0; border-radius: 8px; background: transparent; color: var(--soft); cursor: pointer; }
.m-close:hover { background: var(--tile-hover); }
.m-close svg { width: 15px; height: 15px; }
.m-head { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; padding-right: 30px; }
.m-icon { flex: none; display: grid; place-items: center; width: 44px; height: 44px; border-radius: 12px; background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); }
.m-icon svg { width: 22px; height: 22px; }
.m-title { margin: 0; font-family: var(--f-display); font-size: 21px; line-height: 1.2; }
.m-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
.m-note { color: var(--soft); font-size: 13.5px; line-height: 1.5; margin: 0; }

.form { display: flex; flex-direction: column; gap: 14px; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field > label, .field > .lbl { font-family: var(--f-mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--soft); }
.field input[type="text"], .field input[type="number"], .field select { width: 100%; padding: 9px 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; }
.field input[type="file"] { font-size: 13px; color: var(--soft); max-width: 100%; }
.field .hint { font-size: 12px; color: var(--soft); }
.err { margin: 0; padding: 8px 12px; border: 1px solid var(--danger); border-radius: 8px; color: var(--danger); font-size: 13.5px; }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.sw { position: relative; cursor: pointer; }
.sw span { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 10px; border: 2px solid var(--line); }
.sw.col span { background: var(--c); }
.sw.ico span { background: var(--tile); color: var(--ink); }
.sw.ico svg { width: 20px; height: 20px; }
.sw input:checked + span { border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 35%, transparent); }
.sw input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

/* cart */
.lines { display: flex; flex-direction: column; gap: 8px; }
.line { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; padding: 10px 12px; background: var(--tile); border: 1px solid var(--line); border-radius: 10px; }
.line .ln { font-weight: 600; overflow-wrap: anywhere; }
.line .lt { font-family: var(--f-mono); font-size: 12px; color: var(--soft); }
.line .lp { font-family: var(--f-mono); font-weight: 500; color: var(--accent); text-align: right; font-variant-numeric: tabular-nums; }
.qty { display: inline-flex; align-items: center; gap: 4px; }
.qty button { width: 28px; height: 28px; padding: 0; border: 1px solid var(--line); border-radius: 7px; background: transparent; cursor: pointer; }
.qty button:hover { background: var(--tile-hover); }
.qty b { min-width: 26px; text-align: center; font-family: var(--f-mono); font-weight: 500; font-variant-numeric: tabular-nums; }
.rm { background: none; border: 0; padding: 0; color: var(--soft); font-size: 12px; text-decoration: underline; cursor: pointer; justify-self: end; }
.total { display: flex; justify-content: space-between; align-items: baseline; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
.total span { font-family: var(--f-mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--soft); }
.total strong { font-family: var(--f-display); font-size: 24px; color: var(--accent); font-variant-numeric: tabular-nums; }

#toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); z-index: 300; max-width: calc(100% - 32px); padding: 10px 16px; background: var(--ink); color: var(--bg); border-radius: 10px; font-weight: 600; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }
#toast { text-align: center; max-width: min(680px, calc(100% - 32px)); }
#toast.err { background: var(--danger); color: #fff; }
#toast.warn { background: var(--accent); color: var(--bg); }

.lock-ico { width: 22px; height: 22px; }
.pw-hint { font-size: 12px; color: var(--soft); margin: 0; }
#saveState { font-family: var(--f-mono); }
@media (max-width: 760px) {
  .row { grid-template-columns: minmax(0, 1fr); min-height: 0; }
  .label { flex-direction: row; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 12px; flex-wrap: wrap; }
  .label .n { display: none; }
  .nav { margin-top: 0; }
  .del-cat { margin-top: 0; }
  .tile { flex: 0 0 160px; min-width: 160px; }
  .search { flex: 1 1 100%; }
  .s-meta kbd { display: none; }
}
@media (prefers-reduced-motion: reduce) { .modal, #toast { transition: none; } .strip { scroll-behavior: auto; } }

/* header background: gradient banner with soft glow */
header.top { position: relative; overflow: hidden;
  background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 22%, var(--panel)) 0%, var(--panel) 55%, color-mix(in srgb, var(--h2) 18%, var(--panel)) 100%); }

const supportsFS = () => typeof window.showOpenFilePicker === "function" && typeof indexedDB !== "undefined";
let fileHandle = null, saving = false, pendingSave = false;

const BTN_ENABLE = "Enable Automatic Saving", BTN_RE = "Re-enable Automatic Saving";
const NOT_UPDATED = "The HTML file was NOT updated";

/* results are shown as a message; "busy" steps need no message */
let lastStatus = { kind: "", msg: "" };
function setStatus(kind, msg) { if (kind === "busy") return; lastStatus = { kind, msg }; toast(msg, kind === "ok" ? 4500 : 10000, kind); }

const BLOCK_RE = /(<script type="application\/json" id="store-data">)([\s\S]*?)(<\/script>)/;

async function ensurePerm(h, ask) {

/* validates first, writes through the browser's swap file (the old content stays until close() succeeds), then reads back */
async function writeFile(h, json) {

  const out = replaceDataBlock(text, json);
  if (!out) throw new Error("the selected file has no catalogue data block");
  const chk = extractBlock(out);
  if (!chk || !Array.isArray(chk.categories) || chk.updated !== DB.updated || !/<\/html>\s*$/i.test(out)) throw new Error("the new content failed validation, so nothing was written");

    try { const r = await h.createWritable(); await r.write(text); await r.close(); restored = true; } catch (x) { /* ignore */ }
    const err = new Error("the file could not be verified after writing" + (restored ? " and the previous content was restored" : "; please check the file"));

}
async function runSave() {

  if (!fileHandle) fileHandle = await idb.get("file");
  if (!fileHandle) { setStatus("warn", NOT_UPDATED + ": automatic saving is not enabled yet. " + note + " Click Enable Automatic Saving once to select the file.", BTN_ENABLE); return; }
  if (!(await ensurePerm(fileHandle, true))) { setStatus("warn", NOT_UPDATED + ": permission to edit it was not granted. " + note, BTN_RE); return; }
  setStatus("busy", "Writing the catalogue into the HTML file...");
  try {
    await writeFile(fileHandle, json);
    setStatus("ok", "HTML file updated and verified at " + hhmmss() + ". The latest catalogue is embedded in the file.");
  } catch (e) {

/* called after every password-authorised catalogue change */

    catch (e) { setStatus("err", NOT_UPDATED + " (" + errMsg(e) + ").", BTN_RE); }

/* Every add/remove/password change ends here: the admin must confirm before the main HTML file is touched.

let committed = null, confirming = false;
const snap = () => JSON.stringify({ c: DATA, h: DB.adminHash });
function changeSummary() {
  const o = JSON.parse(committed), out = [];
  const oc = new Map(o.c.map((c) => [c.id, c])), nc = new Map(DATA.map((c) => [c.id, c]));
  DATA.forEach((c) => {
    const p = oc.get(c.id);
    if (!p) { out.push('Add category "' + c.name + '"' + (c.types.length ? " with " + c.types.length + (c.types.length === 1 ? " type" : " types") : "")); return; }
    c.types.filter((x) => !p.types.includes(x)).forEach((x) => out.push('Add type "' + x + '" to ' + c.name));
    p.types.filter((x) => !c.types.includes(x)).forEach((x) => out.push('Remove type "' + x + '" from ' + c.name));
  });
  o.c.forEach((c) => { if (!nc.has(c.id)) out.push('Remove category "' + c.name + '"'); });

}

/* one-time setup (also used to re-grant permission): the administrator selects the existing store HTML file */
async function enableAutoSave() {
  if (!supportsFS()) { setStatus("warn", NOT_UPDATED + ": " + UNSUPPORTED + "."); return; }
  try {
    let h = fileHandle || await idb.get("file");
    if (!(h && await ensurePerm(h, true))) {
      setStatus("busy", "Select the existing Apps Works Store HTML file in the dialog, then allow editing.");
      [h] = await window.showOpenFilePicker({ id: "aw-store", multiple: false, types: [{ description: "Apps Works Store HTML", accept: { "text/html": [".html", ".htm"] } }] });
      const text = await (await h.getFile()).text();
      if (!/Apps Works Store/.test(text) || !replaceDataBlock(text, "{}")) throw new Error("that file is not the Apps Works Store HTML");
      if (!(await ensurePerm(h, true))) { setStatus("warn", NOT_UPDATED + ": permission to edit it was not granted. " + browserNote(true), BTN_ENABLE); return; }
    }
    fileHandle = h;
    const stored = await idb.set("file", h);
    await runSave();
    if (!stored) toast(lastStatus.msg + " (This browser could not remember the file, so you may need to select it again next time.)", 10000, lastStatus.kind === "ok" ? "warn" : lastStatus.kind);

    if (e && e.name === "AbortError") { setStatus("warn", "Setup cancelled. " + NOT_UPDATED + " yet; automatic saving is not enabled. " + browserNote(true), BTN_ENABLE); return; }

  }
}

/* generic dialog */
function openModal(title, iconInner, fill, wide) {
  const o = document.createElement("div");
  o.className = "modal"; o.setAttribute("role", "dialog"); o.setAttribute("aria-modal", "true"); o.setAttribute("aria-label", title);
  o.innerHTML = `<div class="m-panel${wide ? " wide" : ""}"><button class="m-close" type="button" aria-label="Close dialog">${svg(ICON_X)}</button><div class="m-head"><span class="m-icon">${svg(iconInner)}</span><h2 class="m-title">${esc(title)}</h2></div><div class="m-body"></div></div>`;
  document.body.appendChild(o);
  const last = document.activeElement;
  const close = () => { if (api.onClose) { const f = api.onClose; api.onClose = null; f(); } o.classList.remove("open"); document.removeEventListener("keydown", onKey, true); setTimeout(() => o.remove(), 200); if (last && last.focus) last.focus(); };
  const onKey = (e) => {
    if (e.key === "Escape") { e.stopPropagation(); close(); return; }
    if (e.key === "Tab") {
      const f = o.querySelectorAll("a[href], button:not([disabled]), input:not([type=hidden]), select, textarea"); if (!f.length) return;
      const first = f[0], end = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); end.focus(); }
      else if (!e.shiftKey && document.activeElement === end) { e.preventDefault(); first.focus(); }
    }
  };
  o.querySelector(".m-close").addEventListener("click", close);
  o.addEventListener("mousedown", (e) => { if (e.target === o) close(); });
  const api = { close, body: o.querySelector(".m-body"), el: o };
  fill(api);
  document.addEventListener("keydown", onKey, true);
  o.style.display = "grid";
  requestAnimationFrame(() => o.classList.add("open"));
  setTimeout(() => { const t = o.querySelector("input:not([type=radio]), select, .btn"); if (t) t.focus(); }, 60);
  return api;
}

        <div class="line">
          <div><div class="ln">${esc(l.p.name)}</div><div class="lt">${esc(l.c.name)} / ${esc(l.p.type)} &middot; ${inr.format(l.p.price)}</div></div>
          <div class="lp">${inr.format(l.p.price * l.qty)}</div>
          <div class="qty"><button type="button" data-q="-1" data-id="${l.p.id}" aria-label="Decrease quantity of ${esc(l.p.name)}">&minus;</button><b>${l.qty}</b><button type="button" data-q="1" data-id="${l.p.id}" aria-label="Increase quantity of ${esc(l.p.name)}">+</button></div>
          <button class="rm" type="button" data-rm="${l.p.id}">Remove</button>
        </div>`).join("")}</div>
        <div class="total"><span>Total</span><strong>${inr.format(sum)}</strong></div>
        <div class="m-actions"><button class="btn primary" type="button" data-order>Place order</button><button class="btn" type="button" data-close>Keep shopping</button></div>`;
    }
    api.body.addEventListener("click", (e) => {
      const q = e.target.closest("[data-q]"), rm = e.target.closest("[data-rm]");
      if (e.target.closest("[data-close]")) { api.close(); return; }
      if (q) { const id = q.dataset.id; CART[id] = Math.max(0, (CART[id] || 0) + Number(q.dataset.q)); if (!CART[id]) delete CART[id]; saveCart(); draw(); return; }
      if (rm) { delete CART[rm.dataset.rm]; saveCart(); draw(); return; }
      if (e.target.closest("[data-order]")) {
        const id = "AW-" + Math.floor(100000 + Math.random() * 900000);
        CART = {}; saveCart(); updateCartBadge();
        api.body.innerHTML = `<p class="m-note"><strong style="color:var(--ink)">Order ${id} placed.</strong><br>This storefront has no payment or delivery backend connected yet, so nothing was charged or shipped.</p><div class="m-actions"><button class="btn primary" type="button" data-close>Done</button></div>`;
      }
    });
    draw();
  });
}

/* image upload: shrink to a small square thumbnail so storage stays light */
function readImage(file) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onerror = () => reject(new Error("read"));
    fr.onload = () => {
      const im = new Image();
      im.onerror = () => reject(new Error("img"));
      im.onload = () => {
        const S = 160, c = document.createElement("canvas"); c.width = c.height = S;
        const k = Math.max(S / im.width, S / im.height), w = im.width * k, h = im.height * k;
        c.getContext("2d").drawImage(im, (S - w) / 2, (S - h) / 2, w, h);
        resolve(c.toDataURL("image/jpeg", 0.8));
      };
      im.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/* add product */
function openProductForm(preCat, preType) {
  if (!DATA.length) { openCategoryForm(); return; }
  openModal("Add product", ICON_PLUS, (api) => {
    const cur = DATA.find((c) => c.id === preCat) || DATA[0];
    api.body.innerHTML = `<form class="form" id="pf" novalidate>
      <div class="field"><label for="pf-cat">Category</label><select id="pf-cat">${DATA.map((c) => `<option value="${c.id}"${c.id === cur.id ? " selected" : ""}>${esc(c.name)}</option>`).join("")}</select></div>
      <div class="field"><label for="pf-type">Type</label><input id="pf-type" type="text" list="pf-types" maxlength="30" placeholder="Pick one or type a new type" autocomplete="off"><datalist id="pf-types"></datalist><span class="hint">A new type appears as a chip on the category row.</span></div>
      <div class="field"><label for="pf-name">Product name</label><input id="pf-name" type="text" maxlength="60" autocomplete="off"></div>
      <div class="field"><label for="pf-desc">Description</label><input id="pf-desc" type="text" maxlength="90" autocomplete="off"></div>
      <div class="field"><label for="pf-price">Price (INR)</label><input id="pf-price" type="number" min="0" step="1" inputmode="numeric"></div>
      <div class="field"><label for="pf-img">Photo (optional)</label><input id="pf-img" type="file" accept="image/*"></div>
      <p class="err" id="pf-err" role="alert" hidden></p>
      <div class="m-actions"><button class="btn primary" type="submit">Add product</button><button class="btn" type="button" data-cancel>Cancel</button></div></form>`;
    const catSel = api.body.querySelector("#pf-cat");
    const fillTypes = () => {
      const c = DATA.find((x) => x.id === catSel.value);
      api.body.querySelector("#pf-types").innerHTML = c.types.map((t) => `<option value="${esc(t)}"></option>`).join("");
    };
    catSel.addEventListener("change", fillTypes); fillTypes();
    if (preType) api.body.querySelector("#pf-type").value = preType;
    api.body.querySelector("[data-cancel]").addEventListener("click", api.close);
    api.body.querySelector("#pf").addEventListener("submit", async (e) => {
      e.preventDefault();
      const err = api.body.querySelector("#pf-err");
      const name = api.body.querySelector("#pf-name").value.trim();
      const priceRaw = api.body.querySelector("#pf-price").value;
      const price = Number(priceRaw);
      if (!name) { err.textContent = "Enter a product name."; err.hidden = false; api.body.querySelector("#pf-name").focus(); return; }
      if (priceRaw === "" || !isFinite(price) || price < 0) { err.textContent = "Enter a price of 0 or more."; err.hidden = false; api.body.querySelector("#pf-price").focus(); return; }
      const cat = DATA.find((x) => x.id === catSel.value);
      let type = api.body.querySelector("#pf-type").value.trim() || "General";
      const known = cat.types.find((t) => t.toLowerCase() === type.toLowerCase());
      if (known) type = known;
      else { const o = typeOwner(type); if (o) { err.textContent = `"${type}" is already a type in ${o.name}. Each type can belong to only one category.`; err.hidden = false; return; } cat.types.push(type); }
      let img = "";
      const file = api.body.querySelector("#pf-img").files[0];
      if (file) { try { img = await readImage(file); } catch (x) { err.textContent = "That image could not be read. Choose a JPG or PNG, or leave the photo empty."; err.hidden = false; return; } }
      const prod = { id: uid(), name, desc: api.body.querySelector("#pf-desc").value.trim(), price: Math.round(price), type, img };
      cat.products.push(prod);
      rowFilter[cat.id] = "All";
      if (!saveData()) toast("Added, but this browser could not save it");
      else toast(`Added ${name} to ${cat.name}`);
      api.close(); render();
      const s = document.querySelector(`.row[data-cat="${cat.id}"] .strip`);
      if (s) { s.scrollLeft = s.scrollWidth; updateNav(s.closest(".row")); s.closest(".row").scrollIntoView({ block: "nearest", behavior: "smooth" }); }
    });
  });
}

/* add category */
function openCategoryForm() {
  openModal("Add category", CAT_ICONS[0], (api) => {
    api.body.innerHTML = `<form class="form" id="cf" novalidate>
      <div class="field"><label for="cf-name">Category name</label><input id="cf-name" type="text" maxlength="30" autocomplete="off"></div>
      <div class="field"><label for="cf-types">Types</label><input id="cf-types" type="text" maxlength="160" placeholder="Comma separated, e.g. Men, Women, Kids" autocomplete="off"><span class="hint">Each type can belong to only one category. You can add more later with "Add type".</span></div>
      <div class="field"><span class="lbl" id="cf-col-l">Colour</span><div class="swatches" role="radiogroup" aria-labelledby="cf-col-l">
        ${[0, 1, 2, 3, 4, 5].map((i) => `<label class="sw col" style="--c:var(--h${i + 1})"><input class="sr-only" type="radio" name="cf-col" value="${i}"${i === DATA.length % 6 ? " checked" : ""}><span></span><span class="sr-only">Colour ${i + 1}</span></label>`).join("")}</div></div>
      <div class="field"><span class="lbl" id="cf-ico-l">Icon</span><div class="swatches" role="radiogroup" aria-labelledby="cf-ico-l">
        ${CAT_ICONS.map((p, i) => `<label class="sw ico"><input class="sr-only" type="radio" name="cf-ico" value="${i}"${i === 0 ? " checked" : ""}><span>${svg(p)}</span><span class="sr-only">Icon ${i + 1}</span></label>`).join("")}</div></div>
      <p class="err" id="cf-err" role="alert" hidden></p>
      <div class="m-actions"><button class="btn primary" type="submit">Add category</button><button class="btn" type="button" data-cancel>Cancel</button></div></form>`;
    api.body.querySelector("[data-cancel]").addEventListener("click", api.close);
    api.body.querySelector("#cf").addEventListener("submit", (e) => {
      e.preventDefault();
      const err = api.body.querySelector("#cf-err");
      const name = api.body.querySelector("#cf-name").value.trim();
      if (!name) { err.textContent = "Enter a category name."; err.hidden = false; api.body.querySelector("#cf-name").focus(); return; }
      if (DATA.some((c) => c.name.toLowerCase() === name.toLowerCase())) { err.textContent = "A category with this name already exists."; err.hidden = false; return; }
      const types = [];
      api.body.querySelector("#cf-types").value.split(",").map((t) => t.trim()).filter(Boolean).forEach((t) => { if (!types.some((x) => x.toLowerCase() === t.toLowerCase())) types.push(t); });
      const clash = types.find((t) => typeOwner(t));
      if (clash) { err.textContent = `"${clash}" is already a type in ${typeOwner(clash).name}. Each type can belong to only one category.`; err.hidden = false; return; }
      const cat = { id: uid(), name, hue: Number(api.body.querySelector('input[name="cf-col"]:checked').value), icon: Number(api.body.querySelector('input[name="cf-ico"]:checked').value), types, products: [] };
      DATA.push(cat); saveData(); api.close(); render();
      toast(`Added category ${name}`);
      const row = document.querySelector(`.row[data-cat="${cat.id}"]`); if (row) row.scrollIntoView({ block: "nearest", behavior: "smooth" });
    });
  });
}

/* add type to an existing category */
function openTypeForm(catId) {
  const cat = DATA.find((c) => c.id === catId); if (!cat) return;
  openModal("Add type", ICON_PLUS, (api) => {
    api.body.innerHTML = `<form class="form" id="tf" novalidate>
      <p class="m-note">New type in <strong style="color:var(--ink)">${esc(cat.name)}</strong>. It shows as a chip above the products.</p>
      <div class="field"><label for="tf-name">Type name</label><input id="tf-name" type="text" maxlength="30" autocomplete="off"></div>
      <div class="field"><label for="tf-desc">Description (optional)</label><input id="tf-desc" type="text" maxlength="40" autocomplete="off"><span class="hint">Up to 40 characters, shown on the type tile.</span></div>
      <div class="check"><input id="tf-edge" type="checkbox"><label for="tf-edge">Open this type's link in Microsoft Edge only</label></div>
      <p class="err" id="tf-err" role="alert" hidden></p>
      <div class="m-actions"><button class="btn primary" type="submit">Add type</button><button class="btn" type="button" data-cancel>Cancel</button></div></form>`;
    api.body.querySelector("[data-cancel]").addEventListener("click", api.close);
    api.body.querySelector("#tf").addEventListener("submit", (e) => {
      e.preventDefault();
      const err = api.body.querySelector("#tf-err");
      const t = api.body.querySelector("#tf-name").value.trim();
      if (!t) { err.textContent = "Enter a type name."; err.hidden = false; return; }
      const own = typeOwner(t);
      if (own) { err.textContent = own.id === cat.id ? "This type already exists in the category." : `"${t}" is already a type in ${own.name}. Each type can belong to only one category.`; err.hidden = false; return; }
      cat.types.push(t);
      const d = api.body.querySelector("#tf-desc").value.trim().slice(0, 40), ed = api.body.querySelector("#tf-edge").checked;
      if (d || ed) { cat.meta = cat.meta || {}; cat.meta[t] = {}; if (d) cat.meta[t].desc = d; if (ed) cat.meta[t].edge = true; }
      rowFilter[cat.id] = t; saveData(); api.close(); render(); toast(`Added type ${t}`);
    });
  });
}


/* type dialog: products inside one type */
function openTypeDialog(catId, type) {
  const cat = DATA.find((c) => c.id === catId); if (!cat) return;
  openModal(type, CAT_ICONS[cat.icon] || CAT_ICONS[0], (api) => {
    function draw() {
      const items = cat.products.filter((p) => p.type === type);
      api.body.innerHTML = `<p class="m-note">${esc(cat.name)} &middot; ${items.length} ${items.length === 1 ? "product" : "products"}</p>
        <div class="plist" style="--hue:${hueVar(cat)}">${items.length ? items.map((p) => `
          <div class="pitem">
            <span class="mono">${p.img ? `<img class="pimg" src="${p.img}" alt="">` : svg(CAT_ICONS[cat.icon] || CAT_ICONS[0], "aico")}</span>
            <div class="pt"><div class="ln">${esc(p.name)}</div>${p.desc ? `<div class="lt">${esc(p.desc)}</div>` : ""}<div class="lp">${inr.format(p.price)}</div></div>
            <button class="add" type="button" data-add="${p.id}" aria-label="Add ${esc(p.name)} to cart">${svg(ICON_PLUS)}</button>
            <button class="rm pdel" type="button" data-pdel="${p.id}">Delete</button>
          </div>`).join("") : `<p class="m-note">No products in ${esc(type)} yet.</p>`}</div>
        <div class="m-actions"><button class="btn primary" type="button" data-addp>Add product</button><button class="btn" type="button" data-close>Close</button></div>`;
    }
    api.body.addEventListener("click", (e) => {
      const d = e.target.closest("[data-pdel]");
      if (e.target.closest("[data-close]")) { api.close(); return; }
      if (e.target.closest("[data-addp]")) { api.close(); requireAdmin(() => openProductForm(catId, type)); return; }
      if (d) arm(d, () => {
        const f = findProduct(d.dataset.pdel); if (!f) return;
        cat.products = cat.products.filter((x) => x.id !== f.p.id); delete CART[f.p.id];
        saveData(); saveCart(); updateCartBadge(); draw(); render(); toast(`Deleted ${f.p.name}`);
      });
    });
    draw();
  }, true);
}

/* clicks */
document.addEventListener("click", (e) => {
  const t = e.target;
  let el;
  if ((el = t.closest(".nav button"))) {
    const s = el.closest(".row").querySelector(".strip");
    s.scrollBy({ left: Number(el.dataset.dir) * s.clientWidth * 0.8, behavior: "smooth" }); return;
  }
  if ((el = t.closest("[data-add]"))) { addToCart(el.dataset.add); return; }
  if ((el = t.closest("[data-deltype]"))) {
    arm(el, () => {
      const c = DATA.find((x) => x.id === el.dataset.cat); if (!c) return;
      const ty = el.dataset.deltype;
      c.products.filter((p) => p.type === ty).forEach((p) => delete CART[p.id]);
      c.products = c.products.filter((p) => p.type !== ty); c.types = c.types.filter((x) => x !== ty); if (c.meta) delete c.meta[ty];
      saveData(); saveCart(); updateCartBadge(); render(); toast(`Deleted type ${ty}`);
    }); return;
  }
  if ((el = t.closest("[data-open]"))) { openTypeDialog(el.dataset.cat, el.dataset.open); return; }
  if ((el = t.closest("[data-chip]"))) { rowFilter[el.dataset.cat] = el.dataset.chip; render(); return; }
  if ((el = t.closest("[data-addtype]"))) { const id = el.dataset.addtype; requireAdmin(() => openTypeForm(id)); return; }
  if ((el = t.closest("[data-addin]"))) { openProductForm(el.dataset.addin); return; }
  if ((el = t.closest("[data-del]"))) {
    arm(el, () => {
      const f = findProduct(el.dataset.del); if (!f) return;
      f.c.products = f.c.products.filter((x) => x.id !== f.p.id); delete CART[f.p.id];
      saveData(); saveCart(); updateCartBadge(); render(); toast(`Deleted ${f.p.name}`);
    }); return;
  }
  if ((el = t.closest("[data-delcat]"))) {
    arm(el, () => {
      const c = DATA.find((x) => x.id === el.dataset.delcat); if (!c) return;
      DATA = DATA.filter((x) => x.id !== c.id); saveData(); updateCartBadge(); render(); toast(`Deleted category ${c.name}`);
    }); return;
  }
});
$("#addProductBtn").addEventListener("click", () => requireAdmin(() => openProductForm()));
$("#cartBtn").addEventListener("click", openCart);
$("#pwBtn").addEventListener("click", changePassword);
$("#fileBtn").addEventListener("click", () => requireAdmin(async () => {
  fileHandle = null; await idb.set("file", null);   // forget the old file, then pick the new one
  await enableAutoSave();
}));
$("#resetBtn").addEventListener("click", (e) => arm(e.currentTarget, async () => {
  const j = await fetchDefaultJson();
  DATA = j ? j.categories : seed(); CART = {};
  Object.keys(rowFilter).forEach((k) => delete rowFilter[k]);
  saveData(); saveCart(); updateCartBadge(); render(); toast("Default data restored");
}));

/* search */
$("#q").addEventListener("input", render);
function clearSearch() { $("#q").value = ""; render(); }
$("#sClear").addEventListener("click", () => { clearSearch(); $("#q").focus(); });
$("#emptyReset").addEventListener("click", (e) => { if (e.currentTarget.dataset.mode === "cat") openCategoryForm(); else { clearSearch(); $("#q").focus(); } });
document.addEventListener("keydown", (e) => {
  if ((e.key === "Enter" || e.key === " ") && e.target.matches && e.target.matches(".tile[data-open]")) { e.preventDefault(); openTypeDialog(e.target.dataset.cat, e.target.dataset.open); return; }
  if ((e.key === "Enter" || e.key === " ") && LINKS_LIVE && e.target.matches && e.target.matches(".tile[data-vtype]")) { e.preventDefault(); e.target.click(); return; }
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
  if (e.key === "/" && !typing) { e.preventDefault(); $("#q").focus(); }
  if (e.key === "Escape" && document.activeElement === $("#q")) { $("#q").value = ""; render(); $("#q").blur(); }
});

/* theme toggle (remembered per viewer) */
const root = document.documentElement;
const savedTheme = store.get("hub-theme");
if (savedTheme) root.setAttribute("data-theme", savedTheme);
$("#themeBtn").addEventListener("click", () => {
  const cur = root.getAttribute("data-theme");
  const dark = cur ? cur === "dark" : !matchMedia("(prefers-color-scheme: light)").matches;
  const next = dark ? "light" : "dark";
  root.setAttribute("data-theme", next); store.set("hub-theme", next);
});

committed = snap();
updateCartBadge(); render(); initAutoSave();
if (!DB.initialized && !DATA.length) {
  fetchDefaultJson().then((j) => { DATA = j ? j.categories : seed(); DB.categories = DATA; committed = snap(); render(); });
}
</script>
