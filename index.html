<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}

</style></head><body>
<title>Apps Works Store</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one-screen bookshelf. Every category is a shelf, every type is a book spine. Categories, types and products are all added from the page. */
:root {
  --bg: #f4f6fa; --panel: #ffffff; --tile: #ffffff; --tile-hover: #eef2f8;
  --ink: #1e293b; --soft: #64748b; --line: #e2e8f0;
  --accent: #2563eb; --on-accent: #ffffff; --live: #16a34a; --danger: #dc2626; --on-hue: #ffffff;
  --plank: #cbd5e1; --spine-mix: #ffffff; --shadow: 0 1px 2px rgba(15, 23, 42, .06), 0 1px 3px rgba(15, 23, 42, .06);
  --h1: #6366f1; --h2: #0284c7; --h3: #ea580c; --h4: #d97706; --h5: #059669; --h6: #db2777;
  --c1: #2563eb; --c2: #dc2626; --c3: #15803d; --c4: #a16207; --c5: #7c3aed; --c6: #db2777; --c7: #0891b2; --c8: #8b5e3c; --c9: #a21caf; --c10: #475569; --c11: #4d7c0f; --c12: #0f766e;
  --fav: #e8782a;
  --k-electronics: #3b82c4; --k-fashion: #d9588f; --k-home: #d9a01e; --k-grocery: #43a047; --k-books: #9c6b43; --k-sports: #7c5fd1; --k-ia7sj6y: #e0443f; --k-bnc3vyi: #14a3a8;
  --f-display: "Syne", "Trebuchet MS", system-ui, sans-serif;
  --f-body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #1b2434; --panel: #243044; --tile: #2b3850; --tile-hover: #34445f;
  --ink: #f1f5f9; --soft: #a9b6ca; --line: #3d4c66;
  --accent: #60a5fa; --on-accent: #0f172a; --live: #4ade80; --danger: #f87171; --on-hue: #0f172a;
  --plank: #4b5b77; --spine-mix: #1b2434; --shadow: 0 1px 2px rgba(0, 0, 0, .2);
  --h1: #a5b4fc; --h2: #7dd3fc; --h3: #fdba74; --h4: #fcd34d; --h5: #6ee7b7; --h6: #f9a8d4;
  --c1: #60a5fa; --c2: #f87171; --c3: #4ade80; --c4: #d97706; --c5: #a78bfa; --c6: #f472b6; --c7: #22d3ee; --c8: #d6a77a; --c9: #e879f9; --c10: #94a3b8; --c11: #a3e635; --c12: #2dd4bf;
  --fav: #e8782a;
  --k-electronics: #7ab3e8; --k-fashion: #f08fb8; --k-home: #f2c14e; --k-grocery: #7bd37f; --k-books: #c9976a; --k-sports: #b4a0f0; --k-ia7sj6y: #f58a85; --k-bnc3vyi: #4fd1d6;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 15px; line-height: 1.4;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
}
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app-shell { min-height: 100%; max-width: 1840px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }

/* header */
.top { display: flex; align-items: center; gap: 12px 18px; flex-wrap: wrap; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px 14px; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1 1 220px; }
.mark { width: 38px; height: 38px; flex: none; }
.brand h1 { margin: 0; font-family: var(--f-display); font-weight: 800; font-size: 22px; letter-spacing: -.02em; line-height: 1.05; }
.brand p { margin: 2px 0 0; font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--soft); }
.search { position: relative; flex: 0 1 340px; min-width: 180px; }
.search input { width: 100%; padding: 9px 92px 9px 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; }
.search input::placeholder { color: var(--soft); }
.s-meta { position: absolute; right: 9px; top: 50%; transform: translateY(-50%); display: flex; align-items: center; gap: 6px; font-family: var(--f-mono); font-size: 11px; color: var(--soft); }
.s-meta kbd { font-family: var(--f-mono); font-size: 11px; color: var(--soft); border: 1px solid var(--line); border-radius: 4px; padding: 0 6px; }
.s-clear { display: none; place-items: center; width: 22px; height: 22px; padding: 0; border: 0; border-radius: 6px; background: var(--tile-hover); cursor: pointer; }
.s-clear svg { width: 11px; height: 11px; }
.search.has-value .s-clear { display: grid; }
.search.has-value kbd { display: none; }
.status { display: flex; align-items: center; gap: 12px; font-family: var(--f-mono); }
.live { display: flex; align-items: center; gap: 8px; font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--soft); white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--live); animation: pulse 2.4s infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--live) 70%, transparent); } 70%, 100% { box-shadow: 0 0 0 8px transparent; } }
.time { font-size: 21px; font-weight: 500; letter-spacing: .05em; color: var(--accent); font-variant-numeric: tabular-nums; }
.date { font-size: 12px; color: var(--soft); text-align: right; line-height: 1.3; }
.actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.theme-btn { background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 7px 11px; font-family: var(--f-mono); font-size: 12px; cursor: pointer; }
.theme-btn:hover { background: var(--tile-hover); }

.sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.skip { position: absolute; left: 12px; top: -60px; z-index: 200; padding: 8px 14px; background: var(--ink); color: var(--bg); border-radius: 8px; text-decoration: none; font-weight: 600; }
.skip:focus { top: 10px; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 18px; border: 1px solid var(--line); border-radius: 10px; background: transparent; color: var(--ink); font-weight: 600; text-decoration: none; cursor: pointer; }
.btn:hover { background: var(--tile-hover); }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: transparent; }
.btn.primary:hover { filter: brightness(1.08); }
.btn:disabled { opacity: .7; cursor: default; }
.btn svg { width: 16px; height: 16px; flex: none; }
.btn.sm { height: 34px; padding: 0 13px; font-size: 13.5px; border-radius: 8px; }
.btn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.badge { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--accent); color: var(--on-accent); font-family: var(--f-mono); font-size: 11px; font-weight: 500; }

/* offers banner */
.quote { position: relative; display: flex; align-items: center; gap: 12px; padding: 8px 10px 8px 18px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.quote::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 4px; background: var(--accent); }
.quote h2 { margin: 0; flex: none; font-family: var(--f-display); font-size: 15px; font-weight: 700; }
.quote blockquote { margin: 0; flex: 1; min-width: 0; font-size: 14.5px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.quote blockquote span { color: var(--soft); white-space: nowrap; }
.q-nav { display: flex; gap: 4px; flex: none; }
.q-nav button { display: grid; place-items: center; width: 28px; height: 28px; padding: 0; border: 1px solid var(--line); border-radius: 8px; background: transparent; cursor: pointer; }
.q-nav button:hover { background: var(--tile-hover); }
.q-nav svg { width: 13px; height: 13px; }
.q-bar { position: absolute; left: 0; bottom: 0; height: 2px; width: 100%; background: var(--accent); transform: scaleX(0); transform-origin: left; }
.q-bar.run { animation: qbar var(--dur, 9s) linear forwards; }
@keyframes qbar { to { transform: scaleX(1); } }

.cico { flex: none; width: 26px; height: 26px; padding: 4px; border-radius: 8px; background: color-mix(in srgb, var(--on-hue) 16%, transparent); }
.del-cat { display: none; margin-top: 6px; align-self: flex-start; height: 26px; padding: 0 10px; border-radius: 6px; border: 1px solid color-mix(in srgb, var(--on-hue) 55%, transparent); background: color-mix(in srgb, var(--on-hue) 12%, transparent); color: var(--on-hue); font-family: var(--f-mono); font-size: 11px; cursor: pointer; }
body.manage .del-cat { display: inline-block; }


.aico { width: 18px; height: 18px; }
.mono { flex: none; width: 36px; height: 36px; display: grid; place-items: center; overflow: hidden; border-radius: 10px; background: color-mix(in srgb, var(--hue) 18%, transparent); color: var(--hue); border: 1px solid color-mix(in srgb, var(--hue) 40%, transparent); }
.mono .pimg { width: 100%; height: 100%; object-fit: cover; display: block; }
.name { font-weight: 600; font-size: 14px; line-height: 1.2; overflow-wrap: anywhere; }
.desc { font-size: 11.5px; color: var(--soft); line-height: 1.3; margin-top: 1px; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.meta { display: flex; align-items: center; gap: 8px; margin-top: 4px; flex-wrap: wrap; }
.price { font-family: var(--f-mono); font-size: 14px; font-weight: 500; color: var(--accent); font-variant-numeric: tabular-nums; }
.tag { flex: none; font-family: var(--f-mono); font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; padding: 1px 5px; border: 1px solid var(--hue); color: var(--hue); border-radius: 3px; }
.add { flex: none; display: grid; place-items: center; width: 34px; height: 34px; padding: 0; border: 1px solid var(--line); border-radius: 9px; background: transparent; cursor: pointer; color: var(--ink); }
.add:hover { background: var(--hue); color: var(--on-hue); border-color: transparent; }
.add svg { width: 16px; height: 16px; }
.del { display: none; position: absolute; top: 5px; right: 5px; place-items: center; min-width: 24px; height: 24px; padding: 0 6px; border: 1px solid var(--danger); border-radius: 6px; background: var(--tile); color: var(--danger); font-family: var(--f-mono); font-size: 11px; cursor: pointer; }
.del svg { width: 11px; height: 11px; }
body.manage .del { display: grid; }
.plist { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
.pitem { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; gap: 12px; align-items: center; padding: 10px 12px; background: var(--tile); border: 1px solid var(--line); border-radius: 10px; }
.pitem .ln { font-weight: 600; overflow-wrap: anywhere; }
.pitem .lt { font-size: 12.5px; color: var(--soft); line-height: 1.3; overflow-wrap: anywhere; }
.pitem .lp { font-family: var(--f-mono); font-weight: 500; color: var(--accent); font-variant-numeric: tabular-nums; margin-top: 2px; }
.pitem .add:hover { background: var(--hue); color: var(--on-hue); border-color: transparent; }
.pdel { display: none; color: var(--danger); }
body.manage .pdel { display: inline-block; }

.empty { padding: 36px 16px; text-align: center; color: var(--soft); border: 1px dashed var(--line); border-radius: 12px; }
.empty h3 { margin: 0 0 6px; font-family: var(--f-display); font-size: 20px; color: var(--ink); }
.empty p { margin: 0; }
.empty .q { color: var(--ink); font-weight: 600; }
.empty .btn { margin-top: 12px; }

.foot { flex: none; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 6px 20px; font-size: 12px; color: var(--soft); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 16px; }
.foot strong { color: var(--ink); font-weight: 600; }
.foot .m { font-family: var(--f-mono); }
.foot .link { background: none; border: 0; padding: 0; color: var(--soft); text-decoration: underline; cursor: pointer; font-size: 12px; }
.foot .link:hover { color: var(--ink); }

/* dialogs */
.modal { position: fixed; inset: 0; z-index: 100; display: none; place-items: center; padding: 16px; background: rgba(15, 23, 42, .4); backdrop-filter: blur(3px); opacity: 0; transition: opacity .2s; }
.modal.open { opacity: 1; }
.m-panel { position: relative; width: min(440px, 100%); max-height: calc(100% - 8px); overflow-y: auto; padding: 26px 24px 22px; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 16px; }
.m-panel.wide { width: min(560px, 100%); }
.m-close { position: absolute; top: 10px; right: 10px; display: grid; place-items: center; width: 32px; height: 32px; padding: 0; border: 0; border-radius: 8px; background: transparent; color: var(--soft); cursor: pointer; }
.m-close:hover { background: var(--tile-hover); }
.m-close svg { width: 15px; height: 15px; }
.m-head { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; padding-right: 30px; }
.m-icon { flex: none; display: grid; place-items: center; width: 44px; height: 44px; border-radius: 12px; background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); }
.m-icon svg { width: 22px; height: 22px; }
.m-title { margin: 0; font-family: var(--f-display); font-size: 21px; line-height: 1.2; }
.m-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
.m-note { color: var(--soft); font-size: 13.5px; line-height: 1.5; margin: 0; }

.form { display: flex; flex-direction: column; gap: 14px; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field > label, .field > .lbl { font-family: var(--f-mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--soft); }
.field input[type="text"], .field input[type="number"], .field select { width: 100%; padding: 9px 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; }
.field input[type="file"] { font-size: 13px; color: var(--soft); max-width: 100%; }
.field .hint { font-size: 12px; color: var(--soft); }
.err { margin: 0; padding: 8px 12px; border: 1px solid var(--danger); border-radius: 8px; color: var(--danger); font-size: 13.5px; }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.sw { position: relative; cursor: pointer; }
.sw span { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 10px; border: 2px solid var(--line); }
.sw.col span { background: var(--c); }
.sw.ico span { background: var(--tile); color: var(--ink); }
.sw.ico svg { width: 20px; height: 20px; }
.sw input:checked + span { border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 35%, transparent); }
.sw input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

/* cart */
.lines { display: flex; flex-direction: column; gap: 8px; }
.line { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; padding: 10px 12px; background: var(--tile); border: 1px solid var(--line); border-radius: 10px; }
.line .ln { font-weight: 600; overflow-wrap: anywhere; }
.line .lt { font-family: var(--f-mono); font-size: 12px; color: var(--soft); }
.line .lp { font-family: var(--f-mono); font-weight: 500; color: var(--accent); text-align: right; font-variant-numeric: tabular-nums; }
.qty { display: inline-flex; align-items: center; gap: 4px; }
.qty button { width: 28px; height: 28px; padding: 0; border: 1px solid var(--line); border-radius: 7px; background: transparent; cursor: pointer; }
.qty button:hover { background: var(--tile-hover); }
.qty b { min-width: 26px; text-align: center; font-family: var(--f-mono); font-weight: 500; font-variant-numeric: tabular-nums; }
.rm { background: none; border: 0; padding: 0; color: var(--soft); font-size: 12px; text-decoration: underline; cursor: pointer; justify-self: end; }
.total { display: flex; justify-content: space-between; align-items: baseline; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
.total span { font-family: var(--f-mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--soft); }
.total strong { font-family: var(--f-display); font-size: 24px; color: var(--accent); font-variant-numeric: tabular-nums; }

#toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); z-index: 300; max-width: calc(100% - 32px); padding: 10px 16px; background: var(--ink); color: var(--bg); border-radius: 10px; font-weight: 600; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }
#toast { text-align: center; max-width: min(680px, calc(100% - 32px)); }
#toast.err { background: var(--danger); color: #fff; }
#toast.warn { background: var(--accent); color: var(--on-accent); }

.lock-ico { width: 22px; height: 22px; }
.pw-hint { font-size: 12px; color: var(--soft); margin: 0; }
#saveState { font-family: var(--f-mono); }
@media (max-width: 760px) {
  .date { display: none; }
  .search { flex: 1 1 100%; }
  .quote h2, .q-nav { display: none; }
  .s-meta kbd { display: none; }
}
@media (prefers-reduced-motion: reduce) { .dot, .q-bar { animation: none; } .modal, #toast { transition: none; } }

/* ===== bookshelf layout: every category is a shelf, every type is a book spine ===== */
.board { display: grid; grid-template-columns: repeat(var(--cols, 3), minmax(0, 1fr)); gap: 12px 24px; align-content: start; --u: 1; padding: 6px 2px 2px; }
.shelf { --hue: var(--h1); min-width: 0; }
.shelf h2 { display: flex; align-items: center; gap: 8px; margin: 0 0 6px; min-height: 26px; font-family: var(--f-display); font-size: 14.5px; font-weight: 700; }
.shelf h2 .cico { flex: none; width: 24px; height: 24px; padding: 4px; border-radius: 7px; background: var(--hue); color: var(--on-hue); }
.shelf h2 .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.shelf h2 small { margin-left: auto; flex: none; font-family: var(--f-mono); font-size: 11px; font-weight: 400; color: var(--soft); }
.bk-controls { display: flex; align-items: center; gap: 4px; flex: none; margin-left: 2px; }
.bk-arrow { display: grid; place-items: center; flex: none; width: 27px; height: 24px; padding: 0; border: 1px solid color-mix(in srgb, var(--hue) 38%, var(--line)); border-radius: 6px; background: transparent; color: var(--ink); font: 16px/1 var(--f-body); cursor: pointer; transition: background .15s, border-color .15s; }
.bk-arrow:hover:not(:disabled) { background: color-mix(in srgb, var(--hue) 10%, transparent); border-color: var(--hue); }
.bk-arrow:disabled { opacity: .35; cursor: default; }
.bk-arrow:focus-visible { outline: 2px solid var(--hue); outline-offset: 2px; }
.shelf .del-cat { margin: 0; flex: none; border-color: var(--danger); background: var(--tile); color: var(--danger); }
.fav-x { flex: none; height: 24px; padding: 0 9px; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: var(--soft); font-family: var(--f-mono); font-size: 11px; cursor: pointer; }
.fav-x:hover { color: var(--ink); border-color: var(--hue); }
.bk { display: flex; align-items: flex-end; gap: 5px; height: calc(235px * var(--u)); padding: 0 calc(11px * var(--u)); border-bottom: 8px solid var(--plank); border-radius: 2px; background: linear-gradient(to top, color-mix(in srgb, var(--hue) 7%, transparent), transparent 70%); overflow-x: auto; overflow-y: hidden; overscroll-behavior-x: contain; scrollbar-width: none; -ms-overflow-style: none; scroll-behavior: smooth; }
.sp { position: relative; flex: 0 0 44px; min-width: 44px; width: 44px; height: calc(var(--sh) * var(--u)); display: flex; align-items: center; justify-content: center; padding: calc(26px * var(--u)) 0 calc(4px * var(--u)); border: 0; border-radius: 4px 4px 0 0; overflow: hidden; color: var(--on-hue); cursor: pointer; transform-origin: bottom center;
  background-color: color-mix(in srgb, var(--hue) var(--m, 100%), var(--spine-mix));
  background-image: linear-gradient(90deg, rgba(0,0,0,.08), transparent 35%, rgba(255,255,255,.12) 62%, rgba(0,0,0,.10));
  transition: transform .2s ease, box-shadow .2s; }
.sp::before { content: ""; position: absolute; left: 0; right: 0; top: calc(10px * var(--u)); height: 4px; background: color-mix(in srgb, var(--on-hue) 40%, transparent); box-shadow: 0 calc(8px * var(--u)) 0 color-mix(in srgb, var(--on-hue) 40%, transparent); }
.sp .sn { writing-mode: vertical-rl; white-space: nowrap; font-family: var(--f-body); font-weight: 700; font-size: calc(var(--label-size, 18px) * var(--u)); line-height: 1; letter-spacing: .025em; }

/* every type belongs to exactly one category: duplicates (case-insensitive) are dropped on load */
function normalize(j) {

  const seen = new Set();
  cats.forEach((c) => {
    c.products = Array.isArray(c.products) ? c.products : [];
    c.types = (Array.isArray(c.types) ? c.types : []).filter((t) => { const k = String(t).toLowerCase(); if (seen.has(k)) return false; seen.add(k); return true; });
  });
  return { version: 1, initialized: !!(j && j.initialized), updated: (j && j.updated) || "", adminHash: (j && j.adminHash) || hashPw("admin123"), categories: cats };
}
function loadEmbedded() {

/* ---- Saving ----
   Two different things, never mixed up:
   1) browser storage = a convenience copy in this browser only;
   2) the real HTML file = rewritten only after "Enable Automatic Saving" + write permission, and only reported as

const idb = {

};

const BTN_ENABLE = "Enable Automatic Saving", BTN_RE = "Re-enable Automatic Saving";

/* results are shown as a message; "busy" steps need no message */
let lastStatus = { kind: "", msg: "" };
function setStatus(kind, msg) { if (kind === "busy") return; lastStatus = { kind, msg }; toast(msg, kind === "ok" ? 4500 : 10000, kind); }
function dataJson() {

const BLOCK_RE = /(<script type="application\/json" id="store-data">)([\s\S]*?)(<\/script>)/;

async function ensurePerm(h, ask) {

  if (p !== "granted" && ask) { try { p = await h.requestPermission({ mode: "readwrite" }); } catch (e) { /* needs a user click */ } }

/* validates first, writes through the browser's swap file (the old content stays until close() succeeds), then reads back */
async function writeFile(h, json) {
  const text = await (await h.getFile()).text();
  if (!/Apps Works Store/.test(text)) throw new Error("the selected file is not the Apps Works Store HTML");
  const out = replaceDataBlock(text, json);
  if (!out) throw new Error("the selected file has no catalogue data block");
  const chk = extractBlock(out);
  if (!chk || !Array.isArray(chk.categories) || chk.updated !== DB.updated || !/<\/html>\s*$/i.test(out)) throw new Error("the new content failed validation, so nothing was written");
  let w = null;
  try { w = await h.createWritable(); await w.write(out); await w.close(); }
  catch (e) { try { if (w) await w.abort(); } catch (x) { /* ignore */ } throw e; }
  const back = await (await h.getFile()).text();
  if (back !== out) {
    let restored = false;
    try { const r = await h.createWritable(); await r.write(text); await r.close(); restored = true; } catch (x) { /* ignore */ }
    const err = new Error("the file could not be verified after writing" + (restored ? " and the previous content was restored" : "; please check the file"));
    err.keepNote = true; throw err;
  }
}
async function runSave() {

  if (!fileHandle) fileHandle = await idb.get("file");
  if (!fileHandle) { setStatus("warn", NOT_UPDATED + ": automatic saving is not enabled yet. " + note + " Click Enable Automatic Saving once to select the file.", BTN_ENABLE); return; }
  if (!(await ensurePerm(fileHandle, true))) { setStatus("warn", NOT_UPDATED + ": permission to edit it was not granted. " + note, BTN_RE); return; }
  setStatus("busy", "Writing the catalogue into the HTML file...");
  try {
    await writeFile(fileHandle, json);
    setStatus("ok", "HTML file updated and verified at " + hhmmss() + ". The latest catalogue is embedded in the file.");
  } catch (e) {
    if (/not the Apps Works Store|no catalogue data block/.test(errMsg(e))) fileHandle = null;
    setStatus("err", NOT_UPDATED + " (" + errMsg(e) + ")." + (e && e.keepNote ? "" : " The original file was left unchanged.") + " " + note, BTN_RE);

/* one-time setup (also used to re-grant permission): the administrator selects the existing store HTML file */
async function enableAutoSave() {
  if (!supportsFS()) { setStatus("warn", NOT_UPDATED + ": " + UNSUPPORTED + "."); return; }
  try {
    let h = fileHandle || await idb.get("file");
    if (!(h && await ensurePerm(h, true))) {
      setStatus("busy", "Select the existing Apps Works Store HTML file in the dialog, then allow editing.");
      [h] = await window.showOpenFilePicker({ id: "aw-store", multiple: false, types: [{ description: "Apps Works Store HTML", accept: { "text/html": [".html", ".htm"] } }] });
      const text = await (await h.getFile()).text();
      if (!/Apps Works Store/.test(text) || !replaceDataBlock(text, "{}")) throw new Error("that file is not the Apps Works Store HTML");
      if (!(await ensurePerm(h, true))) { setStatus("warn", NOT_UPDATED + ": permission to edit it was not granted. " + browserNote(true), BTN_ENABLE); return; }
    }
    fileHandle = h;
    const stored = await idb.set("file", h);
    await runSave();
    if (!stored) toast(lastStatus.msg + " (This browser could not remember the file, so you may need to select it again next time.)", 10000, lastStatus.kind === "ok" ? "warn" : lastStatus.kind);
  } catch (e) {
    if (e && e.name === "AbortError") { setStatus("warn", "Setup cancelled. " + NOT_UPDATED + " yet; automatic saving is not enabled. " + browserNote(true), BTN_ENABLE); return; }
    setStatus("err", "Could not enable automatic saving: " + errMsg(e) + ". " + NOT_UPDATED + ". " + browserNote(true), BTN_ENABLE);
  }
}

function render() {

/* Choose shelf columns and vertical scale only; book widths remain large and overflow is handled by arrows. */
function layoutBoard() {

  let best = { u: 0, c: 1 };
  for (let c = 1; c <= (narrow ? 1 : 4); c++) {
    const rows = Math.ceil(n / c);
    const u = Math.min(1, narrow ? 9 : (avail / rows - 74) / 235);

const renderFav = () => {};   // the Favourites shelf refreshes on the next render (search, Manage, reload) so shelves never jump under the pointer

/* two-step confirm for destructive buttons */
function arm(btn, action) {
  if (btn.dataset.armed) { requireAdmin(action); return; }
  btn.dataset.armed = "1";
  const old = btn.innerHTML; btn.textContent = "Confirm?";
  setTimeout(() => { if (btn.isConnected) { delete btn.dataset.armed; btn.innerHTML = old; } }, 3000);
}

/* cart */
function cartLines() {
  const out = [];
  Object.keys(CART).forEach((id) => { const f = findProduct(id); if (f && CART[id] > 0) out.push({ p: f.p, c: f.c, qty: CART[id] }); else delete CART[id]; });
  return out;
}
function updateCartBadge() { $("#cartCount").textContent = cartLines().reduce((n, l) => n + l.qty, 0); }
function addToCart(id) {
  const f = findProduct(id); if (!f) return;
  CART[id] = (CART[id] || 0) + 1; saveCart(); updateCartBadge();
  toast(`Added ${f.p.name} to cart`);
}

/* generic dialog */
function openModal(title, iconInner, fill, wide) {
  const o = document.createElement("div");
  o.className = "modal"; o.setAttribute("role", "dialog"); o.setAttribute("aria-modal", "true"); o.setAttribute("aria-label", title);
  o.innerHTML = `<div class="m-panel${wide ? " wide" : ""}"><button class="m-close" type="button" aria-label="Close dialog">${svg(ICON_X)}</button><div class="m-head"><span class="m-icon">${svg(iconInner)}</span><h2 class="m-title">${esc(title)}</h2></div><div class="m-body"></div></div>`;
  document.body.appendChild(o);
  const last = document.activeElement;
  const close = () => { if (api.onClose) { const f = api.onClose; api.onClose = null; f(); } o.classList.remove("open"); document.removeEventListener("keydown", onKey, true); setTimeout(() => o.remove(), 200); if (last && last.focus) last.focus(); };
  const onKey = (e) => {
    if (e.key === "Escape") { e.stopPropagation(); close(); return; }
    if (e.key === "Tab") {
      const f = o.querySelectorAll("a[href], button:not([disabled]), input:not([type=hidden]), select, textarea"); if (!f.length) return;
      const first = f[0], end = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); end.focus(); }
      else if (!e.shiftKey && document.activeElement === end) { e.preventDefault(); first.focus(); }
    }
  };
  o.querySelector(".m-close").addEventListener("click", close);
  o.addEventListener("mousedown", (e) => { if (e.target === o) close(); });
  const api = { close, body: o.querySelector(".m-body"), el: o };
  fill(api);
  document.addEventListener("keydown", onKey, true);
  o.style.display = "grid";
  requestAnimationFrame(() => o.classList.add("open"));
  setTimeout(() => { const t = o.querySelector("input:not([type=radio]), select, .btn"); if (t) t.focus(); }, 60);
  return api;
}

/* cart dialog */
function openCart() {
  openModal("Your cart", ICON_CART, (api) => {

        return;
      }
      const sum = lines.reduce((n, l) => n + l.p.price * l.qty, 0);
      api.body.innerHTML = `<div class="lines">${lines.map((l) => `
        <div class="line">
          <div><div class="ln">${esc(l.p.name)}</div><div class="lt">${esc(l.c.name)} / ${esc(l.p.type)} &middot; ${inr.format(l.p.price)}</div></div>
          <div class="lp">${inr.format(l.p.price * l.qty)}</div>

/* image upload: shrink to a small square thumbnail so storage stays light */
function readImage(file) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onerror = () => reject(new Error("read"));
    fr.onload = () => {
      const im = new Image();
      im.onerror = () => reject(new Error("img"));
      im.onload = () => {
        const S = 160, c = document.createElement("canvas"); c.width = c.height = S;
        const k = Math.max(S / im.width, S / im.height), w = im.width * k, h = im.height * k;
        c.getContext("2d").drawImage(im, (S - w) / 2, (S - h) / 2, w, h);
        resolve(c.toDataURL("image/jpeg", 0.8));
      };
      im.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

      const prod = { id: uid(), name, desc: api.body.querySelector("#pf-desc").value.trim(), price: Math.round(price), type, img };

/* ---- Type links: a tap on a type searches that type on Google. Types marked "edge" open in Microsoft Edge only.
   A web page cannot open a private/incognito window by itself. Set PRIVATE_PREFIX to the custom protocol of a small
   launcher installed on the PC (for example "awprivate:") and every normal link is handed to it; leave "" for a normal tab. ---- */
const GOOGLE_SEARCH = "https://www.google.com/search?q=";
const EDGE_PREFIX = "microsoft-edge:";
const PRIVATE_PREFIX = "";
function openTypeLink(catId, type) {
  const cat = DATA.find((c) => c.id === catId), inf = ((cat && cat.typeInfo) || {})[type] || {};
  const url = inf.url || GOOGLE_SEARCH + encodeURIComponent(type);
  const a = document.createElement("a");
  a.rel = "noopener noreferrer";
  if (inf.edge) { a.href = EDGE_PREFIX + url; toast("Opening " + type + " in Microsoft Edge..."); }
  else if (PRIVATE_PREFIX) { a.href = PRIVATE_PREFIX + url; toast("Opening " + type + " in a private window..."); }
  else { a.href = url; a.target = "_blank"; toast("Searching Google for " + type + "..."); }
  a.style.display = "none"; document.body.appendChild(a); a.click(); a.remove();
}

/* hover / keyboard-focus card: long name, 40-char description and where the link goes */
const tipEl = document.createElement("div"); tipEl.id = "tip"; tipEl.setAttribute("role", "tooltip"); document.body.appendChild(tipEl);
function showTip(el) {
  const t = el.dataset.type, cat = DATA.find((c) => c.id === el.dataset.cat) || {}, inf = (cat.typeInfo || {})[t] || {};
  tipEl.innerHTML = `<b>${esc(inf.title || t)}</b>${inf.desc ? `<p>${esc(inf.desc)}</p>` : ""}<span class="tg${inf.edge ? " ed" : ""}">${inf.edge ? "Opens in Microsoft Edge" : "Google search: " + esc(t)}</span><i>${esc(cat.title || cat.name || "")}</i>`;
  tipEl.classList.add("on");
  const r = el.getBoundingClientRect(), w = tipEl.offsetWidth, h = tipEl.offsetHeight;
  let y = r.top - h - 14; if (y < 8) y = r.bottom + 14;
  tipEl.style.left = Math.min(Math.max(8, r.left + r.width / 2 - w / 2), innerWidth - w - 8) + "px";
  tipEl.style.top = y + "px";
}
const hideTip = () => tipEl.classList.remove("on");
document.addEventListener("mouseover", (e) => { const el = e.target.closest && e.target.closest(".sp[data-type]"); if (el && !e.target.closest(".del")) showTip(el); else hideTip(); });
document.addEventListener("focusin", (e) => { const el = e.target.closest && e.target.closest(".sp[data-type]"); if (el) showTip(el); else hideTip(); });
document.addEventListener("focusout", hideTip);
window.addEventListener("scroll", hideTip, true);
document.addEventListener("click", hideTip, true);

document.addEventListener("click", (e) => {
  const t = e.target;
  let el;
  const tl = t.closest(".sp[data-type]");
  if (tl && !t.closest(".del")) bumpVisit(tl.dataset.cat, tl.dataset.type);   // every tap on a type counts as a visit for Favourites
  if (t.closest("[data-favclear]")) { VISITS = {}; store.set(VISITS_KEY, VISITS); render(); toast("Favourites cleared"); return; }
  if ((el = t.closest(".sp[data-type]")) && !t.closest(".del")) { openTypeLink(el.dataset.cat, el.dataset.type); return; }
  if ((el = t.closest("[data-add]"))) { addToCart(el.dataset.add); return; }
  if ((el = t.closest("[data-deltype]"))) {
    arm(el, () => {
      const c = DATA.find((x) => x.id === el.dataset.cat); if (!c) return;
      const ty = el.dataset.deltype;
      c.products.filter((p) => p.type === ty).forEach((p) => delete CART[p.id]);
      c.products = c.products.filter((p) => p.type !== ty); c.types = c.types.filter((x) => x !== ty); if (c.typeInfo) delete c.typeInfo[ty];
      saveData(); saveCart(); updateCartBadge(); render(); toast(`Deleted type ${ty}`);
    }); return;
  }
  if ((el = t.closest("[data-open]"))) { openTypeDialog(el.dataset.cat, el.dataset.open); return; }
  if ((el = t.closest("[data-addtype]"))) { const id = el.dataset.addtype; requireAdmin(() => openTypeForm(id)); return; }
  if ((el = t.closest("[data-addin]"))) { openProductForm(el.dataset.addin); return; }
  if ((el = t.closest("[data-del]"))) {
    arm(el, () => {
      const f = findProduct(el.dataset.del); if (!f) return;
      f.c.products = f.c.products.filter((x) => x.id !== f.p.id); delete CART[f.p.id];
      saveData(); saveCart(); updateCartBadge(); render(); toast(`Deleted ${f.p.name}`);
    }); return;
  }
  if ((el = t.closest("[data-delcat]"))) {
    arm(el, () => {
      const c = DATA.find((x) => x.id === el.dataset.delcat); if (!c) return;
      DATA = DATA.filter((x) => x.id !== c.id); saveData(); updateCartBadge(); render(); toast(`Deleted category ${c.name}`);
    }); return;
  }
});
